version: 0.1
component: build
timeoutInSeconds: 10000
shell: bash

env:
  variables:
    IMAGE_NAME: oracle-smart-backend
    OCIR_REGION: qro.ocir.io
    OCIR_NAMESPACE: axozuy0c3gbd
    OCIR_USERNAME: axozuy0c3gbd/a01645849@tec.mx

  vaultVariables:
    OCIR_AUTH_TOKEN: ocid1.vaultsecret.oc1.mx-queretaro-1.amaaaaaa7v5mmhaaf7q2urefhhriu4aezmyxyk4hm3peqlvlpnph6fwa4afa

steps:
  - type: Command
    name: Build Maven package
    command: |
      mvn clean package -DskipTests

  - type: Command
    name: Login to OCIR
    command: |
      echo "${OCIR_AUTH_TOKEN}" | docker login ${OCIR_REGION} -u "${OCIR_USERNAME}" --password-stdin

  - type: Command
    name: Build Docker image
    command: |
      IMAGE_TAG=$(git rev-parse --short HEAD)
      docker build -t ${OCIR_REGION}/${OCIR_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG} .

  - type: Command
    name: Push Docker image
    command: |
      IMAGE_TAG=$(git rev-parse --short HEAD)
      docker push ${OCIR_REGION}/${OCIR_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}

  - type: Command
    name: Prepare backend Kubernetes manifest
    command: |
      IMAGE_TAG=$(git rev-parse --short HEAD)
      sed "s|qro.ocir.io/axozuy0c3gbd/oracle-smart-backend:v1|${OCIR_REGION}/${OCIR_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}|g" k8s/backend/backend-full.yaml > backend-full.generated.yaml

outputArtifacts:
  - name: backend_full_manifest
    type: BINARY
    location: backend-full.generated.yaml
