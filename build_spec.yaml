version: 0.1
component: build
timeoutInSeconds: 10000
shell: bash

env:
  variables:
    IMAGE_NAME: oracle-smart-backend
    IMAGE_TAG: v1
    OCIR_REGION: qro.ocir.io
    OCIR_NAMESPACE: axozuy0c3gbd

steps:
  - type: Command
    name: Build Maven package
    command: |
      mvn clean package -DskipTests

  - type: Command
    name: Build Docker image
    command: |
      docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .

  - type: Command
    name: Tag Docker image
    command: |
      docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${OCIR_REGION}/${OCIR_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}

  - type: Command
    name: Push Docker image
    command: |
      docker push ${OCIR_REGION}/${OCIR_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}
