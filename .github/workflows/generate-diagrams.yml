name: Generate PlantUML Diagrams

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/**'
      - 'pom.xml'

permissions:
  contents: write

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Generate PlantUML class diagrams
        run: mvn compile -Pdiagrams -q

      - name: Commit updated diagrams
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: auto-update PlantUML class diagrams'
          file_pattern: docs/diagrams/*.puml
